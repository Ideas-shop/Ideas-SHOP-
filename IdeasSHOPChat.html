<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ideas SHOP Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg: #ffffff;
    --ink: #22242a;
    --muted: #6f7480;
    --gold: #e3a83b;
    --gold-light: #f4c863;
    --gold-pale: #fbf1dd;
    --hairline: #ece6d8;
    --bubble-user: #22242a;
    --bubble-bot: #fbf1dd;
  }

  *{ box-sizing:border-box; }

  html, body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:'Hind Siliguri', sans-serif;
    color:var(--ink);
    overflow:hidden; /* পুরো পেজ যেন স্ক্রল না হয়, শুধু মেসেজ এরিয়া স্ক্রল হবে */
    overscroll-behavior:none;
  }

  .chat-shell{
    max-width:520px;
    margin:0 auto;
    height:100vh;
    height:100dvh; /* মোবাইলে ব্রাউজারের অ্যাড্রেস বার লুকানো/দেখানোর সাথে ঠিকমতো মানিয়ে নেয় */
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  .chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    border-bottom:1px solid var(--hairline);
    background:var(--bg);
    flex-shrink:0; /* হেডার যেন কখনো ছোট হয়ে না যায় বা স্ক্রল না হয় */
  }

  .chat-header .avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background: radial-gradient(circle at 50% 40%, var(--gold-light), var(--gold) 72%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .chat-header .avatar svg{ width:20px; height:20px; }

  .chat-header .title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    margin:0;
  }
  .chat-header .subtitle{
    font-size:12.5px;
    color:var(--muted);
    margin:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background:#4caf50;
    display:inline-block;
  }

  .chat-header .back{
    margin-left:auto;
    color:var(--muted);
    font-size:18px;
    text-decoration:none;
    padding:6px;
  }

  .chat-header .back-arrow{
    color:var(--ink);
    font-size:18px;
    text-decoration:none;
    padding:6px;
    margin-right:2px;
    flex-shrink:0;
  }
  .chat-header .back-arrow:hover{ color:var(--gold); }

  /* ---------- Messages ---------- */
  .chat-messages{
    flex:1;
    min-height:0; /* Safari/মোবাইলে flex স্ক্রল ঠিকমতো কাজ করার জন্য জরুরি */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .msg{
    max-width:80%;
    padding:11px 15px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .msg.bot{
    align-self:flex-start;
    background:var(--bubble-bot);
    border:1px solid var(--hairline);
    border-bottom-left-radius:4px;
    color:var(--ink);
  }

  .msg.user{
    align-self:flex-end;
    background:var(--bubble-user);
    color:#fff;
    border-bottom-right-radius:4px;
  }

  .msg.typing{
    align-self:flex-start;
    background:var(--bubble-bot);
    border:1px solid var(--hairline);
    border-bottom-left-radius:4px;
    padding:14px 18px;
    display:flex;
    gap:4px;
  }
  .msg.typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold);
    display:inline-block;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .msg.typing span:nth-child(2){ animation-delay:0.15s; }
  .msg.typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%, 60%, 100% { transform:translateY(0); opacity:0.5; }
    30% { transform:translateY(-5px); opacity:1; }
  }

  .quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 16px 14px;
    flex-shrink:0;
  }
  .quick-reply{
    border:1px solid var(--gold);
    color:#a9781f;
    background:var(--gold-pale);
    padding:7px 13px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .quick-reply:hover{ background:var(--gold-light); }

  /* ---------- Input bar ---------- */
  .chat-input-bar{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:12px 14px;
    border-top:1px solid var(--hairline);
    background:var(--bg);
    flex-shrink:0; /* ইনপুট বার যেন কখনো উপরে সরে না যায় বা ছোট না হয় */
  }

  #chat-input{
    flex:1;
    border:1px solid var(--hairline);
    border-radius:22px;
    padding:11px 16px;
    font-size:14.5px;
    font-family:inherit;
    resize:none;
    max-height:110px;
    outline:none;
  }
  #chat-input:focus{ border-color:var(--gold); }

  #send-btn{
    width:42px; height:42px;
    border-radius:50%;
    background:var(--gold);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  #send-btn:active{ transform:scale(0.94); }
  #send-btn:disabled{ opacity:0.5; cursor:default; }

  .chat-messages::-webkit-scrollbar{ width:6px; }
  .chat-messages::-webkit-scrollbar-thumb{ background:var(--hairline); border-radius:3px; }
</style>
</head>
<body>

<div class="chat-shell">

  <div class="chat-header">
    <a href="home.html" class="back-arrow" aria-label="হোমে ফিরে যান"><i class="fas fa-arrow-left"></i></a>
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z" fill="#fff"/>
      </svg>
    </div>
    <div>
      <p class="title">Ideas SHOP Chat</p>
      <p class="subtitle"><span class="status-dot"></span> সবসময় সাড়া দিতে প্রস্তুত</p>
    </div>
    <a href="home.html" class="back"><i class="fas fa-times"></i></a>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="msg bot">
      আসসালামু আলাইকুম! 👋 আমি Ideas SHOP-এর AI Assistant। প্রোডাক্ট, দাম, ডেলিভারি বা অর্ডার নিয়ে যেকোনো প্রশ্ন করতে পারেন।
    </div>
  </div>

  <div class="quick-replies" id="quick-replies">
    <button class="quick-reply" onclick="sendQuickReply('ডেলিভারি চার্জ কত?')">ডেলিভারি চার্জ কত?</button>
    <button class="quick-reply" onclick="sendQuickReply('রিটার্ন পলিসি কী?')">রিটার্ন পলিসি</button>
    <button class="quick-reply" onclick="sendQuickReply('কী কী প্রোডাক্ট আছে?')">প্রোডাক্ট দেখতে চাই</button>
  </div>

  <div class="chat-input-bar">
    <textarea id="chat-input" rows="1" placeholder="মেসেজ লিখুন..."></textarea>
    <button id="send-btn" aria-label="পাঠান"><i class="fas fa-paper-plane"></i></button>
  </div>

</div>

<script>
  // ⚠️ আপনার Render ব্যাকএন্ডের URL এখানে বসান
  const API_URL = "https://ai-agent-hg0l.onrender.com/api/chat";

  const messagesEl = document.getElementById("chat-messages");
  const inputEl = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");
  const quickRepliesEl = document.getElementById("quick-replies");

  // ব্রাউজারে সেশন আইডি সংরক্ষণ করা হচ্ছে, যাতে পেজ রিফ্রেশ করলেও কথোপকথন চলতে থাকে
  let sessionId = localStorage.getItem("ideasshop_chat_session") || null;

  function addMessage(text, sender){
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping(){
    const div = document.createElement("div");
    div.className = "msg typing";
    div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping(){
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendMessage(text){
    if (!text.trim()) return;

    quickRepliesEl.style.display = "none";
    addMessage(text, "user");
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, sessionId })
      });
      const data = await res.json();

      hideTyping();
      addMessage(data.reply || "দুঃখিত, একটু সমস্যা হচ্ছে।", "bot");

      if (data.sessionId) {
        sessionId = data.sessionId;
        localStorage.setItem("ideasshop_chat_session", sessionId);
      }
    } catch (err) {
      hideTyping();
      addMessage("দুঃখিত, সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না। একটু পরে আবার চেষ্টা করুন 🙏", "bot");
    } finally {
      sendBtn.disabled = false;
    }
  }

  function sendQuickReply(text){
    sendMessage(text);
  }

  sendBtn.addEventListener("click", () => sendMessage(inputEl.value));

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + "px";
  });
</script>

</body>
</html>
